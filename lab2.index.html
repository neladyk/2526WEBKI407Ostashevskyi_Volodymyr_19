<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED Panel</title>
<style>
:root {
    --accent: #ff6f61;
    --bg-dark: #1a1a2e;
    --card-bg: rgba(255,255,255,0.05);
}

body {
    margin: 0;
    font-family: 'Verdana', sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #162447);
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: var(--card-bg);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    width: 300px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
}

.card:hover {
    transform: translateY(-5px);
}

h1 {
    color: var(--accent);
    margin-bottom: 1.5rem;
}

.status {
    margin-bottom: 1.5rem;
    font-weight: bold;
    font-size: 1.1rem;
}

.led-circle {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    transition: 0.4s;
}

.led-on {
    background: var(--accent);
    box-shadow: 0 0 25px var(--accent), inset 0 0 10px rgba(255,255,255,0.5);
}

button {
    padding: 12px;
    margin: 5px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    text-transform: uppercase;
    width: 100px;
    transition: 0.2s;
}

.btn-on { background: #22c55e; }
.btn-off { background: #ef4444; }

button:active { transform: scale(0.95); }

.footer {
    margin-top: 20px;
    font-size: 0.7rem;
    color: #aaa;
}
</style>
</head>
<body>

<div class="card">
    <h1>ESP32 LED Panel</h1>
    <div id="led" class="led-circle"></div>
    <div class="status" id="status-text">Статус: Вимкнено</div>
    <div>
        <button class="btn-on" onclick="sendCmd('on')">Вкл</button>
        <button class="btn-off" onclick="sendCmd('off')">Викл</button>
    </div>
    <div class="footer">Автор: Остшевський • 2026</div>
</div>

<script>
async function updateLed() {
    try {
        const resp = await fetch('/status');
        const data = await resp.json();
        const led = document.getElementById('led');
        const statusText = document.getElementById('status-text');
        if(data.led) {
            led.classList.add('led-on');
            statusText.textContent = "Статус: Ввімкнено";
        } else {
            led.classList.remove('led-on');
            statusText.textContent = "Статус: Вимкнено";
        }
    } catch(e) { console.error("Помилка статусу LED"); }
}

async function sendCmd(cmd) {
    try {
        await fetch('/control', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({command: cmd})
        });
        updateLed();
    } catch(e) { alert("Помилка зв'язку з ESP32"); }
}

// Оновлення кожні 2 секунди
setInterval(updateLed, 2000);
updateLed();
</script>

</body>
</html>
