<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Адмін Панель - Осташевський В.М.</title>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #1f1f1f);
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: rgba(30, 30, 30, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff6f00;
            box-shadow: 0 0 30px rgba(255, 111, 0, 0.3);
            text-align: center;
            max-width: 450px;
        }
        h2 {
            color: #ff6f00;
            margin-bottom: 15px;
        }
        p {
            font-size: 1rem;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            padding: 6px 18px;
            background: #ff6f00;
            border-radius: 20px;
            color: #fff;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .note {s
            color: #ffc107;
            font-size: 0.85em;
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="badge">HTTPS АКТИВНО</div>
        <h2>Панель Адміністратора</h2>
        <p>Вітаємо, <strong>Осташевський В.М.</strong>!</p>
        <p>Всі дії захищені TLS/SSL шифруванням.</p>
        <div class="note">
            Примітка: Ваші облікові дані тепер недоступні для перехоплення.
        </div>
    </div>
</body>
</html>
