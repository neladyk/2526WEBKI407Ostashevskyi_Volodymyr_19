<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Dashboard</title>
<style>
body {
    font-family: 'Arial', sans-serif;
    background: #f9f9f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: #222;
}
.card {
    background: #ffffff;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    text-align: center;
    border-left: 5px solid #2196f3;
    transition: transform 0.2s ease;
}
.card:hover {
    transform: translateY(-5px);
}
h1 {
    color: #2196f3;
    margin-bottom: 10px;
}
p {
    font-size: 1.1rem;
    margin: 6px 0;
}
.status-online {
    color: #4caf50;
    font-weight: bold;
}
.footer {
    margin-top: 15px;
    font-size: 0.8rem;
    color: #555;
}
</style>
</head>
<body>
<div class="card">
    <h1>ESP32 Mini Dashboard</h1>
    <p>Пристрій: <strong>ESP32 Dev Module</strong></p>
    <p>Статус: <span class="status-online">Online</span></p>
    <p>Файлова система: <strong>LittleFS</strong></p>
    <div class="footer">Created by Осташевський В.М.</div>
</div>
</body>
</html>
