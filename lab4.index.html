<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>ESP32 Wi-Fi Setup</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>  body {    font-family: 'Arial', sans-serif;    background: linear-gradient(120deg, #c8f7c5, #7ed6df);    color: #0f3d0f;    display: flex;    justify-content: center;    align-items: center;    height: 100vh;    margin: 0;  }  .card {    background: #ffffffcc;    padding: 35px 45px;    border-radius: 20px;    box-shadow: 0 15px 35px rgba(0,0,0,0.2);    width: 360px;    text-align: center;    border: 2px solid #27ae60;  }  h2 {    color: #27ae60;    margin-bottom: 20px;  }  label {    display: block;    margin-top: 12px;    font-weight: bold;  }  input {    width: 100%;    padding: 10px;    margin-top: 5px;    border: 1px solid #27ae60;    border-radius: 10px;    font-size: 14px;  }  input:focus {    outline: none;    border-color: #145a32;    box-shadow: 0 0 5px #145a32;  }  button {    margin-top: 25px;    padding: 12px 25px;    background: #145a32;    color: #fff;    border: none;    border-radius: 10px;    font-size: 16px;    cursor: pointer;    transition: all 0.3s ease;  }  button:hover {    background: #0c3d21;  }  p {    margin-top: 15px;    font-size: 13px;    color: #0b2d0b;  }</style></head><body>  <div class="card">    <h2>Налаштування Wi-Fi</h2>    <form action="/save" method="POST">      <label for="ssid">SSID:</label>      <input type="text" id="ssid" name="ssid" placeholder="Введіть ім'я мережі" required>      <label for="pass">Пароль:</label>      <input type="password" id="pass" name="pass" placeholder="Пароль (необов'язково)">      <button type="submit">Зберегти</button>    </form>    <p>Після збереження ESP32 автоматично перезавантажиться.</p>  </div></body></html>
